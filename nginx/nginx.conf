# =============================================================================
# Operação Sentinel — Nginx como proxy reverso e balanceador (entrega C)
# Base: Apêndice A.2 do enunciado, com os ajustes marcados como [AJUSTE].
# =============================================================================

# Um processo de trabalho basta para o laboratório (carga baixa, máquina única).
worker_processes 1;

events {
  # Conexões simultâneas por worker. Limite explícito de saturação do proxy.
  worker_connections 512;
}

http {
  # ---------------------------------------------------------------------------
  # Logs: uma linha por requisição, com request_id, nó de destino e tempos.
  # O mesmo request_id é enviado ao nó Rust (X-Request-Id) e aparece no log
  # dele -> correlação Nginx <-> Rust.
  #   msec=$msec                    [AJUSTE] horário unix com milissegundos
  #   upstream=$upstream_addr        IP:porta tentados (vários, se houve retry)
  #   node=$upstream_http_x_node     [AJUSTE] nome do nó lido do cabeçalho X-Node
  #   upstream_status                status de cada tentativa (ex.: "502, 200")
  #   req_time                       tempo total visto pelo cliente
  #   upstream_time                  tempo de cada tentativa no upstream
  # ---------------------------------------------------------------------------
  log_format sentinel '$time_iso8601 nginx INFO msec=$msec request_id=$request_id '
                      'method=$request_method uri=$request_uri '
                      'status=$status upstream=$upstream_addr node=$upstream_http_x_node '
                      'upstream_status=$upstream_status req_time=$request_time '
                      'upstream_time=$upstream_response_time';
  access_log /dev/stdout sentinel;   # stdout -> `docker compose logs nginx`
  error_log  /dev/stderr warn;       # erros de upstream (connect refused, timeout)

  # [AJUSTE] DNS interno do Docker. Com "resolve" no upstream, o Nginx volta a
  # resolver rust-a/rust-b periodicamente; se um contêiner reiniciar com outro
  # IP, o Nginx o reencontra sem precisar ser recarregado.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Não revela versão do Nginx em cabeçalhos/páginas de erro.
  server_tokens off;

  # ---------------------------------------------------------------------------
  # Grupo de destino (upstream). Sem diretiva de algoritmo = round-robin.
  # max_fails=3 fail_timeout=10s: 3 falhas dentro de 10 s retiram o nó do pool
  # por 10 s (verificação PASSIVA — o Nginx OSS não sonda; só percebe falhas
  # no tráfego real). Depois de 10 s ele volta a tentar o nó.
  # ---------------------------------------------------------------------------
  upstream rust_pool {
    zone rust_pool 64k;   # [AJUSTE] memória compartilhada, exigida por "resolve"
    server rust-a:8080 max_fails=3 fail_timeout=10s resolve;
    server rust-b:8080 max_fails=3 fail_timeout=10s resolve;
  }

  server {
    listen 80;   # porta interna; publicada no host como 8080 pelo Compose

    location / {
      proxy_pass http://rust_pool;

      # Propaga o identificador único da requisição ao nó (correlação de logs).
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Timeouts explícitos e curtos (regra de ouro 4):
      #   connect 1s -> nó parado/inacessível é detectado em até 1 s
      #   read/send 3s -> nó lento (ex.: atraso de 2,5 s) ainda responde;
      #                   acima de 3 s conta como falha e dispara retry.
      proxy_connect_timeout 1s;
      proxy_read_timeout    3s;
      proxy_send_timeout    3s;

      # Retry LIMITADO: só para erro de conexão, timeout, 502 e 503.
      # NÃO repete em 500 (bug da aplicação: repetir só duplicaria a carga).
      # GET é idempotente, então repetir é seguro. Máximo de 2 tentativas
      # no total (a original + 1 no outro nó) e no máximo 4 s gastos nisso.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries   2;
      proxy_next_upstream_timeout 4s;

      # [AJUSTE] Devolve ao cliente o request_id e o nó que atendeu, para que
      # o teste com curl prove a alternância sem precisar abrir logs.
      proxy_hide_header X-Request-Id;   # evita cabeçalho duplicado (o nó também o devolve)
      add_header X-Request-Id $request_id always;
      add_header X-Upstream   $upstream_addr always;
    }

    # [AJUSTE] Liveness do PRÓPRIO Nginx, respondida localmente. Antes o
    # healthcheck usava /health/live, que era repassado aos nós: a saúde do
    # Nginx dependia dos backends (achado de 02/11, evidência 11).
    location = /nginx/live {
      access_log off;
      default_type text/plain;
      return 200 "nginx ok\n";
    }

    # Endpoints administrativos e de métricas NÃO saem pela porta pública.
    # Só são acessíveis de dentro da rede "sentinel" (watchdog, Prometheus,
    # docker compose exec).
    location /admin/  { return 404; }
    location /metrics { return 404; }
  }
}
